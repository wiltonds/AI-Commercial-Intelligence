# ============================================================
# ENTRADAS DE DADOS — o que precisa ser baixado/rodado para o painel ficar em dia
#
# Uma entrada por fonte. `python jobs/checar_entradas.py` lê esta lista e diz o
# que está em dia, vencido ou faltando, olhando a data do arquivo de controle
# registrada pelo próprio job no log de atualizações.
#
# Campos:
#   nome            como aparece no relatório
#   dono            quem fornece o dado
#   como_obter      o que baixar / exportar, e de onde
#   colunas         colunas que o job exige (se faltar alguma, ele não roda)
#   onde_colocar    onde deixar o arquivo antes de rodar
#   comando         o que rodar (na pasta do repositório)
#   atualiza        o que muda no painel
#   registro        nome no log data/processed/LOG_ATUALIZACOES.csv (gravado pelo job)
#   frequencia_dias de quanto em quanto tempo deve ser atualizado
#   confidencial    true = o dado bruto não vai para o Git (pasta data/privado ou data/contatos)
#   ordem           ordem na rotina mensal (quem depende de quem)
# ============================================================

entradas:

  receita_cnpj:
    nome: Receita Federal — cadastro de CNPJ (dados abertos)
    dono: Receita Federal (público)
    como_obter: >
      Estabelecimentos0..9.zip, Empresas0..9.zip, Simples.zip, Municipios.zip, Cnaes.zip e
      Naturezas.zip da competência mais recente em https://arquivos.receitafederal.gov.br/index.php/s/YggdBLfdninEJX9
      (ou deixar o job baixar com --mes). O BI_Project já guarda os Estabelecimentos.
    colunas: [layout oficial da Receita, sem cabeçalho]
    onde_colocar: uma pasta local, ex. C:/Users/.../BI_Project/downloads_AAAAMM
    comando: >
      python jobs/carregar_base_ampliada.py --pasta <pasta> --mes AAAA-MM ;
      python jobs/incorporar_industrias_novas.py --competencia AAAA-MM
    atualiza: >
      Não indústrias de todos os portes (ME, EPP, Demais), menos o MEI optante (Simples.zip);
      MEI_BASE_MESTRE.csv; indústrias novas entram na Base Mestre;
      e-mail e telefone cadastrais de todas as empresas; lista INDUSTRIAS_NOVAS para o comercial.
    frequencia_dias: 35
    confidencial: false
    ordem: 1

  propostas:
    nome: Propostas SESI/SENAI (relacionamento com cliente)
    dono: Sistema comercial (exportação "Export")
    como_obter: >
      Exportação completa de propostas, todos os status, de 2018 até hoje, em .xlsx
      (a mesma do arquivo "Relacionamento SESI e SENAI").
    colunas: [CNPJ, Razão Social, Entidade, Categoria, Porte, Porte Receita, Status,
              Emissão, Aprovação, Valor total, Natureza Produto]
    onde_colocar: data/privado/propostas.xlsx
    comando: python jobs/atualizar_relacionamento.py --arquivo data/privado/propostas.xlsx
    atualiza: >
      Quem é cliente SESI/SENAI em TODAS as páginas; situação Ativo/Inativo; última compra;
      página Share & Relacionamento (share, produtos mais vendidos, lista de reativação); Porte FIEA.
      Rodar DEPOIS da Receita: se a Base Mestre mudar, o relacionamento precisa ser reaplicado.
    frequencia_dias: 31
    confidencial: true
    ordem: 2

  tabela_dn:
    nome: Tabela DN da CNI (o que é indústria)
    dono: CNI (guardada no BI_Project)
    como_obter: >
      BI_Project/dataset_AAAAMM_v4/CNAE/dim_cnae_AAAAMM.csv, só as linhas com
      eh_cnae_industrial_dn = SIM (567 CNAEs em 07/2026).
    colunas: [cnae, descricao, segmento_nivel_1, segmento_nivel_2, segmento_nivel_3]
    onde_colocar: config/referencia/tabela_dn_cni.csv
    comando: (não há job — copiar o arquivo e rodar de novo a entrada receita_cnpj)
    atualiza: Separação entre Indústria, Indústria fora da Base Mestre e Não indústria.
    frequencia_dias: 365
    confidencial: false
    ordem: 0

  base_mestre:
    nome: Base Mestre de indústrias (pipeline do BI_Project)
    dono: BI_Project (construir_base_mestre.py)
    como_obter: Nova versão do BASE_MESTRE_COMERCIAL.csv gerada pelo BI_Project, quando houver.
    colunas: [cnpj, CNPJ_BASICO, razao_social, Municipio, Porte, SEBRAE_cnae_norm, SEBRAE_setor]
    onde_colocar: data/processed/BASE_MESTRE_COMERCIAL.csv
    comando: >
      Substituir o arquivo e rodar de novo: incorporar_industrias_novas.py e
      atualizar_relacionamento.py (a versão nova não traz as colunas de relacionamento das propostas).
    atualiza: Universo industrial de todo o painel.
    frequencia_dias: 35
    confidencial: false
    ordem: 1

  contatos_robo:
    nome: Contatos e responsável (robô BrasilAPI)
    dono: Automático (BrasilAPI, sem upload)
    como_obter: Nada a baixar. O robô consulta cada CNPJ e reconsulta a cada 90 dias.
    colunas: []
    onde_colocar: (gerado em data/contatos/CONTATOS_EMPRESAS.csv)
    comando: >
      python jobs/enriquecer_contatos.py --limite 14000 --delay 1.5 ;
      python jobs/segunda_passada_contatos.py
    atualiza: Responsável, telefones, WhatsApp e confiança do contato no Explorador.
    frequencia_dias: 90
    confidencial: true
    ordem: 3

  presenca_digital:
    nome: Site, Instagram e e-mail do site (Serper)
    dono: Automático (Google via Serper — precisa de SERPER_API_KEY e créditos)
    como_obter: Nada a baixar. Rodar em lotes enquanto houver créditos.
    colunas: []
    onde_colocar: (gerado em data/contatos/CONTATOS_EMPRESAS.csv)
    comando: python jobs/enriquecer_digital.py --limite 500
    atualiza: Colunas Site, Instagram e E-mail (site) no Explorador.
    frequencia_dias: 180
    confidencial: true
    ordem: 4

  colaboradores:
    nome: Número de colaboradores (Solução 360)
    dono: Solução 360 (exportação de empresas)
    como_obter: >
      Exportação de empresas da Solução 360 com CNPJ e quantidade de colaboradores
      (a aba "CNPJ / Contagem" da planilha empresas_AAAA.xlsx).
    colunas: [CNPJ, Contagem]
    onde_colocar: data/privado/colaboradores.xlsx
    comando: python jobs/importar_colaboradores.py --arquivo data/privado/colaboradores.xlsx
    atualiza: >
      Coluna Colaboradores no Explorador, nas listas SESI | SENAI e no cartão da Visão 360:
      número real quando existe; senão, intervalo estimado (acerta 7 em cada 10).
    frequencia_dias: 90
    confidencial: true
    ordem: 3

  hubs:
    nome: Canais e grupos (escritórios de contabilidade, sócios em comum)
    dono: Automático (usa os contatos já coletados)
    como_obter: Nada a baixar. Rodar depois de atualizar contatos ou a Receita.
    colunas: []
    onde_colocar: (gerado em data/privado/HUBS_CANAIS.xlsx)
    comando: python jobs/mapear_hubs.py
    atualiza: >
      Lista de hubs para o comercial: quem conecta muitas empresas de uma vez (escritório que atende N
      empresas, sócio com vários CNPJs), com quantas já compram e quantas estão sem compra.
    frequencia_dias: 90
    confidencial: true
    ordem: 5

  enderecos:
    nome: Endereço da sede de cada empresa (Receita)
    dono: Receita Federal (público) — mesmos zips da entrada receita_cnpj
    como_obter: Nada novo a baixar — usa a pasta de zips da Receita.
    colunas: [layout oficial da Receita, sem cabeçalho]
    onde_colocar: (gerado em data/contatos/ENDERECOS_AL.csv — fora do Git, tem endereço de MEI)
    comando: python jobs/extrair_enderecos.py --pasta <pasta dos zips>
    atualiza: >
      Bairro, CEP, capital social e natureza de todos os estabelecimentos ativos de AL.
      Base para a carteira por unidade (endereço da sede) e para o alerta "Não ativa na Receita".
    frequencia_dias: 35
    confidencial: true
    ordem: 1

  carteira_unidades:
    nome: Carteira por unidade SESI/SENAI (Minuta de Carteirização)
    dono: Automático (endereços + propostas + config/referencia/carteira_minuta.csv)
    como_obter: Nada a baixar. Rodar depois dos endereços e das propostas.
    colunas: []
    onde_colocar: (gerado em data/processed/CARTEIRA_UNIDADES.csv e data/privado/CARTEIRA_UNIDADES_DETALHE.csv)
    comando: python jobs/distribuir_carteira.py --historico data/privado/propostas.xlsx
    atualiza: >
      Unidade SESI e unidade SENAI de cada empresa: cliente fica na unidade do histórico; empresa nova
      vai pelo bairro (Maceió) ou município da sede; sede fora de AL fica com quem atender primeiro.
    frequencia_dias: 31
    confidencial: false
    ordem: 6

  potencial:
    nome: Prioridade das empresas que nunca compraram (modelo de semelhança)
    dono: Automático (Base Mestre + Base Ampliada + endereços)
    como_obter: Nada a baixar. Rodar depois das propostas (o alvo do modelo é "já comprou").
    colunas: []
    onde_colocar: (gerado em data/processed/POTENCIAL_MERCADO.csv)
    comando: python jobs/calcular_potencial.py
    atualiza: >
      Página Mercado: nota 0–10, prioridade (Muito alto / Alto / Médio / Baixo), motivo e alertas
      (falência, sede fora de AL, não ativa na Receita).
    frequencia_dias: 31
    confidencial: false
    ordem: 7

  publicacao:
    nome: Publicação no painel online
    dono: Você
    como_obter: Nada a baixar.
    colunas: []
    onde_colocar: "-"
    comando: .\jobs\publicar_dados.ps1   (o painel online percebe os CSVs novos sozinho; não precisa reboot)
    atualiza: >
      Leva ao GitHub/Streamlit tudo o que os passos anteriores geraram (menos data/privado e data/contatos),
      e prepara o backup desses dois para o Teams (jobs/backup_teams.ps1): abre a pasta
      Downloads\PARA_O_TEAMS e o SharePoint — arrastar o .zip e as listas para lá.
    frequencia_dias: 35
    confidencial: false
    ordem: 9
