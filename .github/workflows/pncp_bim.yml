# PNCP · BIM em editais de obra (AL) — execução manual.
# Lista as contratações de obra e serviço de engenharia publicadas no PNCP por órgãos de AL
# e lê edital/termo de referência para ver quantas pedem BIM. Grava em data/processed e faz commit.
# Para rodar: aba Actions > "PNCP · BIM em editais de obra" > Run workflow.
name: PNCP · BIM em editais de obra

on:
  workflow_dispatch:
    inputs:
      meses:
        description: "Quantos meses para trás"
        default: "12"
      rapido:
        description: "Rápido: lê documentos só das concorrências ≥ R$ 1 mi (máx. 120)"
        default: "sim"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install pandas requests pypdf
      - name: Coletar editais e ler documentos
        run: |
          if [ "${{ github.event.inputs.rapido }}" = "sim" ]; then
            python -u jobs/coletar_pncp_bim.py --meses "${{ github.event.inputs.meses || '12' }}" --docs-modalidades 4,5 --docs-valor-min 1000000 --docs-max 120
          else
            python -u jobs/coletar_pncp_bim.py --meses "${{ github.event.inputs.meses || '12' }}"
          fi
      - name: Gravar resultado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -f data/processed/PNCP_OBRAS_AL.csv data/processed/PNCP_BIM_RESUMO.csv
          git commit -m "PNCP: editais de obra em AL e uso de BIM" || echo "sem mudanças"
          git pull --rebase origin master && git push
